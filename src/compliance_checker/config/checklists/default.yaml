# 标准工程项目手续清单 - 默认配置
checklist_id: "default"
name: "标准工程项目手续清单"
version: "1.0"

project_period:
  start: "2025-01"
  end: "2027-12"

required_documents:
  - name: "项目立项批复文件"
    aliases: ["立项批复", "项目批复", "立项文件"]
    type: ["pdf", "docx", "jpg", "png"]
    required: true
    validity:
      cover_project: true
    compliance_points:
      - point: "公章"
        required: true
        check_method: "visual"
        search_context: "公章"
      - point: "签字"
        required: true
        check_method: "visual"
        search_context: "法定代表人"
      - point: "文件编号"
        required: true
        check_method: "text"
        pattern: "\\d{4}-\\d{3}"

  - name: "土地使用权证"
    aliases: ["土地证", "国有土地使用证"]
    type: ["pdf", "jpg", "png"]
    required: true
    validity:
      cover_project: true
    compliance_points:
      - point: "公章"
        required: true
        check_method: "visual"
        search_context: "发证机关"

  - name: "环评批复文件"
    aliases: ["环评批复", "环境影响评价批复"]
    type: ["pdf"]
    required: true
    validity:
      issue_after: "2024-01"
    compliance_points:
      - point: "公章"
        required: true
        check_method: "visual"
        search_context: "审批机关"

  - name: "建设工程规划许可证"
    aliases: ["规划许可证", "工程规划证"]
    type: ["pdf", "jpg", "png"]
    required: true
    validity:
      cover_project: true
    compliance_points:
      - point: "公章"
        required: true
        check_method: "visual"
        search_context: "发证机关"
      - point: "证书编号"
        required: true
        check_method: "text"
        pattern: "建字第\\d+号"

  - name: "施工许可证"
    aliases: ["建筑施工许可证", "开工证"]
    type: ["pdf", "jpg", "png"]
    required: true
    validity:
      cover_project: true
    compliance_points:
      - point: "公章"
        required: true
        check_method: "visual"
        search_context: "发证机关"
      - point: "证书编号"
        required: true
        check_method: "text"
        pattern: "\\d{4}\\d{2}\\d{2}\\d{4}"
