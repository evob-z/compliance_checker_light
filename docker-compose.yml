# =============================================================================
# Compliance Checker MCP Service - Docker Compose 配置
# =============================================================================
# 使用说明:
#   # 基础启动 (无 OCR)
#   docker-compose up -d
#
#   # 带本地 OCR 启动
#   OCR_BACKEND=local docker-compose up -d
#
#   # 带云端 OCR 启动
#   OCR_BACKEND=aliyun docker-compose up -d
# =============================================================================

version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        OCR_BACKEND: ${OCR_BACKEND:-none}
    image: ${REGISTRY:-ghcr.io}/${IMAGE_NAME:-evob-z/compliance_checker_light}:${IMAGE_TAG:-latest}
    container_name: compliance-checker
    restart: unless-stopped
    
    environment:
      # LLM 配置
      - LLM_API_KEY=${LLM_API_KEY}
      - LLM_BASE_URL=${LLM_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      - LLM_MODEL=${LLM_MODEL:-qwen-max}
      
      # 嵌入模型配置
      - EMBED_MODEL=${EMBED_MODEL:-text-embedding-v1}
      # - EMBED_API_KEY=${EMBED_API_KEY}  # 可选，默认使用 LLM_API_KEY
      # - EMBED_BASE_URL=${EMBED_BASE_URL}
      
      # 视觉模型配置
      - VISION_MODEL=${VISION_MODEL:-qwen3-vl-flash}
      # - VISION_API_KEY=${VISION_API_KEY}  # 可选，默认使用 LLM_API_KEY
      # - VISION_BASE_URL=${VISION_BASE_URL}
      
      # OCR 配置
      - OCR_BACKEND=${OCR_BACKEND:-none}
      - ALIBABA_CLOUD_ACCESS_KEY_ID=${ALIBABA_CLOUD_ACCESS_KEY_ID}
      - ALIBABA_CLOUD_ACCESS_KEY_SECRET=${ALIBABA_CLOUD_ACCESS_KEY_SECRET}
      
      # 请求配置
      - LLM_TIMEOUT=${LLM_TIMEOUT:-60}
      - LLM_MAX_RETRIES=${LLM_MAX_RETRIES:-3}
      
      # 路径配置
      - CC_DOCUMENT_PATH=${CC_DOCUMENT_PATH:-/app/documents}
      - CC_OUTPUT_DIR=${CC_OUTPUT_DIR:-/app/output}
    
    volumes:
      # 文档目录挂载
      - ${DOCUMENT_HOST_PATH:-./documents}:${CC_DOCUMENT_PATH:-/app/documents}
      # 输出目录挂载
      - ${OUTPUT_HOST_PATH:-./output}:${CC_OUTPUT_DIR:-/app/output}
      # 可选：挂载自定义检查清单
      - ${CHECKLISTS_HOST_PATH:-./checklists}:/app/src/compliance_checker/config/checklists:ro
    
    # MCP Server 使用 stdio 通信，不需要暴露端口
    # 但保留 HTTP 健康检查端口
    ports:
      - "${HEALTH_CHECK_PORT:-8000}:8000"
    
    healthcheck:
      test: ["CMD", "python", "-c", "import compliance_checker"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    
    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '${CPU_LIMIT:-2}'
          memory: ${MEMORY_LIMIT:-4G}
        reservations:
          cpus: '${CPU_RESERVATION:-0.5}'
          memory: ${MEMORY_RESERVATION:-1G}
    
    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
        labels: "service"
        env: "OCR_BACKEND,LLM_MODEL"

  # ==========================================================================
  # 可选：Redis 缓存服务（用于大规模部署）
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: compliance-checker-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    deploy:
      resources:
        limits:
          memory: 256M
    profiles:
      - cache
      - full

  # ==========================================================================
  # 可选：监控服务（Prometheus + Grafana）
  # ==========================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: compliance-checker-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    profiles:
      - monitoring
      - full

  grafana:
    image: grafana/grafana:latest
    container_name: compliance-checker-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    profiles:
      - monitoring
      - full

volumes:
  redis_data:
  prometheus_data:
  grafana_data:

# =============================================================================
# 网络配置
# =============================================================================
networks:
  default:
    name: compliance-checker-network
