[project]
name = "compliance-checker"
version = "0.1.0"
description = "项目手续合规审查助手 - MCP Server"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "evob", email = "2502366203@qq.com"}
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "mcp>=1.0.0",
    "PyMuPDF>=1.23.0",
    "python-docx>=0.8.11",
    "aiohttp>=3.9.0",
    "pyyaml>=6.0",
    "pillow>=10.0.0",
    "openai>=1.0.0",
    "python-dotenv>=0.21.0",
]

[project.optional-dependencies]
# 本地 OCR（PaddleOCR，体积大但无需网络，可选安装）
local-ocr = [
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.5.0",
]

# 云端 OCR（阿里云，轻量但需网络和付费，可选安装）
cloud-ocr = [
    "alibabacloud_ocr_api20210707>=1.0.0",
    "alibabacloud-tea-openapi>=0.3.0",
]

# 完整安装（包含所有可选依赖）
all = [
    "paddleocr>=2.7.0",
    "paddlepaddle>=2.5.0",
    "alibabacloud_ocr_api20210707>=1.0.0",
    "alibabacloud-tea-openapi>=0.3.0",
]

dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
]

[project.scripts]
compliance-checker = "compliance_checker.server:main"

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py310']
