# =============================================================================
# 生产环境 Kustomize 配置
# =============================================================================

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: compliance-checker-prod

resources:
  - ../../base
  - hpa.yaml

namePrefix: prod-

commonLabels:
  environment: prod

replicas:
  - name: compliance-checker
    count: 3

images:
  - name: ghcr.io/evob-z/compliance_checker_light
    newTag: latest

patches:
  - target:
      kind: Deployment
      name: compliance-checker
    patch: |
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/memory
        value: "8Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/limits/cpu
        value: "4000m"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/memory
        value: "2Gi"
      - op: replace
        path: /spec/template/spec/containers/0/resources/requests/cpu
        value: "1000m"
      # 添加 Pod 反亲和性
      - op: add
        path: /spec/template/spec/affinity
        value:
          podAntiAffinity:
            preferredDuringSchedulingIgnoredDuringExecution:
              - weight: 100
                podAffinityTerm:
                  labelSelector:
                    matchExpressions:
                      - key: app
                        operator: In
                        values:
                          - compliance-checker
                  topologyKey: kubernetes.io/hostname
