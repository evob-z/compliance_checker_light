# =============================================================================
# Kubernetes 基础部署配置
# =============================================================================

apiVersion: apps/v1
kind: Deployment
metadata:
  name: compliance-checker
  labels:
    app: compliance-checker
spec:
  replicas: 2
  selector:
    matchLabels:
      app: compliance-checker
  template:
    metadata:
      labels:
        app: compliance-checker
    spec:
      containers:
        - name: app
          image: ghcr.io/evob-z/compliance_checker_light:latest
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: OCR_BACKEND
              value: "none"
            - name: LLM_BASE_URL
              value: "https://dashscope.aliyuncs.com/compatible-mode/v1"
            - name: LLM_MODEL
              value: "qwen-max"
            - name: VISION_MODEL
              value: "qwen3-vl-flash"
            - name: EMBED_MODEL
              value: "text-embedding-v1"
            - name: LLM_TIMEOUT
              value: "60"
            - name: LLM_MAX_RETRIES
              value: "3"
            - name: CC_DOCUMENT_PATH
              value: "/app/documents"
            - name: CC_OUTPUT_DIR
              value: "/app/output"
          envFrom:
            - secretRef:
                name: compliance-checker-secrets
                optional: false
          resources:
            requests:
              memory: "1Gi"
              cpu: "500m"
            limits:
              memory: "4Gi"
              cpu: "2000m"
          livenessProbe:
            exec:
              command:
                - python
                - -c
                - "import compliance_checker"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            exec:
              command:
                - python
                - -c
                - "import compliance_checker"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          volumeMounts:
            - name: documents
              mountPath: /app/documents
            - name: output
              mountPath: /app/output
      volumes:
        - name: documents
          persistentVolumeClaim:
            claimName: compliance-checker-documents
        - name: output
          persistentVolumeClaim:
            claimName: compliance-checker-output
---
apiVersion: v1
kind: Service
metadata:
  name: compliance-checker
  labels:
    app: compliance-checker
spec:
  selector:
    app: compliance-checker
  ports:
    - port: 8000
      targetPort: 8000
      name: http
  type: ClusterIP
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: compliance-checker-documents
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: compliance-checker-output
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 5Gi
