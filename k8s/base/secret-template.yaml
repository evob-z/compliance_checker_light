# =============================================================================
# Secret 模板 - 需要手动创建或替换
# =============================================================================
# 创建命令:
#   kubectl create secret generic compliance-checker-secrets \
#     --from-literal=llm-api-key=your-api-key \
#     --from-literal=alibaba-access-key-id=your-key-id \
#     --from-literal=alibaba-access-key-secret=your-key-secret
# =============================================================================

apiVersion: v1
kind: Secret
metadata:
  name: compliance-checker-secrets
type: Opaque
stringData:
  # LLM API Key (必需)
  llm-api-key: "YOUR_LLM_API_KEY_HERE"
  
  # 可选：阿里云 OCR 配置
  alibaba-access-key-id: ""
  alibaba-access-key-secret: ""
